<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supportable</title><link rel="stylesheet" href="panel.css"></head>
<body><main><header><div><strong>Supportable</strong><span id="status" aria-live="polite">Ready</span></div><select id="theme" aria-label="Theme"><option value="light">Light</option><option value="midnight">Midnight</option><option value="paper">Paper</option></select></header><section id="authPanel"><h2 id="authTitle">Sign in to Supportable</h2><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button id="authSubmit">Sign in</button><button id="authMode" class="secondary">Create account</button></div><p id="authMessage" class="message" aria-live="polite"></p></section><section id="requestPanel" hidden><section class="context"><div id="pageTitle">Current page</div><div id="pageUrl" class="muted"></div></section><label for="request">What do you need help with?</label><textarea id="request" rows="5" placeholder="Describe what happened or what you want to accomplish..."></textarea><label for="type">Request type</label><select id="type"><option value="help">Get help</option><option value="problem">Report a problem</option><option value="feature">Request a feature</option><option value="question">Ask a question</option></select><fieldset><legend>Capture</legend><label><input id="screenshot" type="checkbox"> Screenshot</label><label><input id="video" type="checkbox"> Screen video</label><label><input id="microphone" type="checkbox"> Microphone</label><label><input id="camera" type="checkbox"> Camera overlay</label></fieldset><div class="actions"><button id="capture">Start capture</button><button id="submit" disabled>Submit request</button></div><button id="signOut" class="secondary full">Sign out</button><p id="message" class="message" aria-live="polite"></p></section><section id="capturePanel" hidden><video id="preview" autoplay muted playsinline></video><div id="captureTimer">00:00</div><div class="actions"><button id="startRecording">Start recording</button><button id="stopRecording" disabled>Stop recording</button></div><button id="backToRequest" class="secondary full">Back to request</button><p id="captureMessage" class="message" aria-live="polite"></p></section></main><script src="firefox-compat.js"></script><script src="panel.js"></script></body></html>
